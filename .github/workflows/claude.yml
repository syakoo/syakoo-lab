name: Claude

# Runs Claude Code when the repository owner mentions @claude on an issue,
# PR, or PR review. Steps and triggers: see the `ai-workflow` rule.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Owner-only gate. Anyone else's @claude is ignored (job skipped).
    if: >-
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Setup Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Install dependencies with safe-chain
        run: pnpm install --frozen-lockfile

      - name: Run Claude
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # main requires signed commits; the action signs through the GitHub API
          # (git CLI commits by the bot would be unsigned).
          use_commit_signing: true
          # Allowlist for the agent's shell (the action denies everything else).
          # Mirrors what sdf-implement / create-pull-request need.
          # pnpm add/remove go through safe-chain (installed above); the coding-guide
          # skill limits when a dependency may change.
          # The system prompt overrides the action's built-in "give a manual
          # Create PR link" default, which otherwise wins over the repo rules.
          # It also tells the agent to use the allowlisted pnpm scripts (never call
          # biome/tsc directly: those are denied and previously made a run stop
          # before the PR) and to continue instead of ending on a denied command.
          claude_args: >-
            --allowedTools "Task,Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm type-check),Bash(pnpm test),Bash(pnpm check:architecture),Bash(pnpm build),Bash(pnpm add:*),Bash(pnpm remove:*),Bash(pnpm storybook:build),Bash(pnpm storybook:test:ci),Bash(pnpm storybook:test:vrt:update:ci),Bash(pnpm exec playwright install:*)" --append-system-prompt "When you are asked to implement (@claude implement on a Draft PR), run the sdf-implement skill from the agreed design.md, following the ai-workflow and sdf rules. The pull request already exists as a draft: finalize it with gh pr edit and gh pr ready per the create-pull-request skill; do not open another one and do not give a manual Create PR link. Unattended, you cannot ask questions: list unresolved Needs clarification items under Impact and risks in the PR body. If the design does not hold (a boundary, the data shape, a decision, or an acceptance example must change), stop: post a PR comment with what differed and the options, leave the PR as a draft, and do not push further slices. Run checks only through the allowed pnpm scripts (for example pnpm lint, not biome directly). If a command is denied, switch to the allowed equivalent and continue; do not stop before the pull request is ready. In every other case, do not open a pull request."
