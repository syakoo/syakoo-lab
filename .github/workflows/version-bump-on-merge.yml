name: Version bump on merge

# After a PR merges to main, bump package.json from its semver:* label and
# publish a GitHub Release. Trigger is pull_request closed (not push), so the
# Contents-API bump commit does not re-enter this workflow.
# A merge made with GITHUB_TOKEN (the maintainer gate) fires no `closed` event,
# so maintainer.yml calls this workflow with the PR number instead.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_call:
    inputs:
      pr:
        description: Number of the merged pull request
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    # In a called workflow `github.event_name` is the caller's event, so test the input.
    if: inputs.pr != '' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CALL_PR: ${{ inputs.pr }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$CALL_PR" ]]; then
            if ! [[ "$CALL_PR" =~ ^[0-9]+$ ]]; then
              echo "::error::pr must be an integer"
              exit 1
            fi
            json="$(gh api "repos/${REPO}/pulls/${CALL_PR}")"
            if [[ "$(jq -r .merged <<<"$json")" != "true" ]]; then
              echo "::error::PR #${CALL_PR} is not merged"
              exit 1
            fi
            labels="$(jq -r '[.labels[].name] | join(",")' <<<"$json")"
            author="$(jq -r .user.login <<<"$json")"
            merge_sha="$(jq -r .merge_commit_sha <<<"$json")"
          else
            labels="$EVENT_LABELS"
            author="$EVENT_AUTHOR"
            merge_sha="$EVENT_MERGE_SHA"
          fi
          {
            echo "labels=$labels"
            echo "author=$author"
            echo "merge_sha=$merge_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve bump level
        id: level
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a label_arr <<< "$LABELS"
          has() {
            local needle=$1
            local label
            for label in "${label_arr[@]}"; do
              [[ "$label" == "$needle" ]] && return 0
            done
            return 1
          }
          if has semver:major; then
            level=major
          elif has semver:minor; then
            level=minor
          elif has semver:patch; then
            level=patch
          elif [[ "$AUTHOR" == "renovate[bot]" ]]; then
            level=patch
          else
            echo "::error::Merged without semver:* label (and not renovate[bot]). No release was published — bump package.json and create the GitHub Release manually."
            exit 1
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Checkout merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.merge_sha }}

      - name: Bump package.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ steps.level.outputs.level }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x scripts/bump-semver.sh
          old="$(node -p "require('./package.json').version")"
          new="$(./scripts/bump-semver.sh "$LEVEL")"
          echo "Bump $old → $new ($LEVEL)"

          if gh release view "v${new}" >/dev/null 2>&1; then
            echo "Release v${new} already exists; aborting to avoid overwrite."
            exit 1
          fi

          # main requires signed commits — Contents API commits are signed by GitHub.
          CONTENT="$(base64 -w0 package.json 2>/dev/null || base64 < package.json | tr -d '\n')"
          SHA="$(gh api "repos/${REPO}/contents/package.json" --jq .sha)"
          gh api -X PUT "repos/${REPO}/contents/package.json" \
            -f message="chore: bump version to ${new}" \
            -f sha="$SHA" \
            -f content="$CONTENT"

          notes="$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="v${new}" \
            -f previous_tag_name="v${old}" \
            -f target_commitish=main \
            --jq .body)"

          gh release create "v${new}" \
            --target main \
            --title "v${new}" \
            --notes "$notes"
