name: CI

on:
  - pull_request

env:
  WAKU_PUBLIC_GOOGLE_ANALYTICS_ID: "dummy-ga-id"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Setup Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Verify safe-chain protection
        run: pnpm safe-chain-verify

      - name: Install dependencies with safe-chain
        run: pnpm install --frozen-lockfile
        env:
          SAFE_CHAIN_LOGGING: verbose

  lint:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

  type-check:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        run: pnpm type-check

  unit-test:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run unit test
        run: pnpm test

  build-check:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Build
        run: pnpm build

  storybook-test:
    needs: security-scan
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check container image matches installed Playwright
        run: |
          image="$(bash scripts/vrt-image.sh)"
          job_block="$(awk '/^  storybook-test:/{f=1;next} f&&/^  [a-z]/{exit} f' .github/workflows/ci.yml)"
          if ! printf '%s\n' "${job_block}" | grep -qxF "      image: ${image}"; then
            echo "::error::Update the storybook-test container image in ci.yml to ${image}, then re-capture baselines (pnpm storybook:test:vrt:update)."
            exit 1
          fi

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run Storybook tests (a11y + VRT)
        id: storybook_test
        run: pnpm storybook:test:ci

      - name: Detect VRT mismatches
        id: vrt
        if: always() && (steps.storybook_test.outcome == 'success' || steps.storybook_test.outcome == 'failure')
        run: |
          report_dir="__snapshots__/vrt/__report__"
          if [ -d "$report_dir" ] && [ -n "$(find "$report_dir" -name '*.json' -print -quit)" ]; then
            echo "has_diffs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diffs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload VRT diff artifacts
        if: always() && steps.vrt.outputs.has_diffs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-diff-${{ github.run_id }}
          path: |
            __snapshots__/vrt/__diff_output__/
            __snapshots__/vrt/__received_output__/
            __snapshots__/vrt/__report__/
          retention-days: 7

      # Only after tests actually ran (success or a11y failure). Skip when build/install
      # failed earlier — nothing useful to report, and we avoid a no-op comment step.
      - name: Comment VRT summary on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (steps.storybook_test.outcome == 'success' || steps.storybook_test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAS_DIFFS: ${{ steps.vrt.outputs.has_diffs }}
        run: bash ./scripts/comment-vrt-report.sh
