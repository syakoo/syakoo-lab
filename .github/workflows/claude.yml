name: Claude

# Runs Claude Code when the repository owner mentions @claude on an issue,
# PR, or PR review. Steps and triggers: see the `ai-workflow` rule.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Owner-only gate. Anyone else's @claude is ignored (job skipped).
    if: >-
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js and Pnpm
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Setup Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Install dependencies with safe-chain
        run: pnpm install --frozen-lockfile

      - name: Run Claude
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Allowlist for the agent's shell (the action denies everything else).
          # Mirrors what implement-issue / self-review / create-pull-request need.
          claude_args: >-
            --allowedTools "Task,Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(pnpm lint),Bash(pnpm type-check),Bash(pnpm test),Bash(pnpm check:architecture),Bash(pnpm build),Bash(pnpm storybook:build),Bash(pnpm storybook:test:ci),Bash(pnpm storybook:test:vrt:update:ci),Bash(pnpm exec playwright install:*)"
